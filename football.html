<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Messi Penalty Hero</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; background:#0b1d3a; overflow:hidden; touch-action:none; }
  body{ display:flex; align-items:center; justify-content:center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas{ display:block; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); cursor:crosshair; }
  #mute{ position:fixed; bottom:10px; right:10px; z-index:2; background:rgba(255,255,255,.15); color:#fff;
         border:0; border-radius:50%; width:40px; height:40px; font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<button id="mute" aria-label="Sound on or off">🔊</button>
<canvas id="c"></canvas>
<script>
(() => {
  const W = 400, H = 640;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let scale = 1;

  function resize(){
    const s = Math.min(innerWidth / W, innerHeight / H);
    scale = s;
    const dpr = devicePixelRatio || 1;
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
    cv.width = W * s * dpr;
    cv.height = H * s * dpr;
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- Game data ----------
  const GOAL = { l: 60, r: 340, top: 140, bot: 270 };
  const SPOT = { x: 200, y: 560 };
  const KICKS = 5;
  const LEVELS = [
    { name: 'Rosario Kids Cup',  keeper: 'Little Pedro',   skill: 0.2,  speed: 160 },
    { name: 'La Masia Academy',  keeper: 'Keeper Jordi',   skill: 0.3,  speed: 180 },
    { name: 'Barcelona Derby',   keeper: 'Big Marco',      skill: 0.4,  speed: 200 },
    { name: 'Copa América',      keeper: 'The Wall',       skill: 0.45, speed: 215 },
    { name: 'World Cup Final',   keeper: 'Super Keeper',   skill: 0.5,  speed: 230 },
  ];
  const FACTS = [
    'Messi was born in Rosario, Argentina, on 24 June 1987.',
    'Messi joined Barcelona’s academy, La Masia, when he was just 13.',
    'Messi has won the Ballon d’Or 8 times — more than anyone ever!',
    'Messi lifted the World Cup with Argentina in 2022.',
    'Messi’s nickname is “La Pulga” — The Flea!',
    'Messi scored 91 goals in 2012 — a world record for one year.',
    'Messi is Barcelona’s all-time top scorer with 672 goals.',
    'Messi is left-footed, just like his famous dribbles!',
    'Messi won the Copa América with Argentina in 2021 and 2024.',
    'Messi joined Inter Miami in the USA in 2023.',
  ];
  const GOAL_LINES = ['GOOOOL!', 'WHAT A STRIKE!', 'TOP BINS!', 'UNSTOPPABLE!', 'MESSI MAGIC!'];
  const SAVE_LINES = ['SAVED!', 'What a save!', 'Keeper got it!'];

  let best = 0;
  try { best = +localStorage.getItem('messiBest') || 0; } catch(e) {}

  let state = 'title';           // title | aim | shot | result | matchEnd | champion
  let level = 0, kick = 0, goals = 0, results = [];
  let totalGoals = 0;
  let ball, keeper, aim = null, msg = '', msgColor = '#fff', timer = 0, shake = 0;
  let particles = [], fact = '', netHit = null, won = false;

  function resetKeeper(){
    keeper = { x: 200, y: GOAL.bot - 45, tx: 200, ty: GOAL.bot - 45, delay: 0, dir: 0 };
  }
  function resetBall(){
    ball = { x: SPOT.x, y: SPOT.y, sx: SPOT.x, sy: SPOT.y, tx: 0, ty: 0, t: 0, r: 13, flying: false, bounce: null };
  }
  function newMatch(){
    kick = 0; goals = 0; results = []; resetKeeper(); resetBall(); state = 'aim'; msg = '';
  }
  resetKeeper(); resetBall();

  // ---------- Sound ----------
  let ac = null, muted = false;
  const muteBtn = document.getElementById('mute');
  muteBtn.onclick = e => { e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; };
  function audio(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } return ac; }
  function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0){
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function crowd(dur = 1.5, vol = 0.25){
    const a = audio(); if (!a || muted) return;
    const len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / (len * 0.15)) * (1 - i / len);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
  }
  const sfx = {
    kick: () => tone(120, 0.15, 'triangle', 0.5, 50),
    whistle: () => { tone(2200, 0.25, 'square', 0.06); setTimeout(() => tone(2200, 0.4, 'square', 0.06), 280); },
    goal: () => { crowd(2, 0.35); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'square', 0.08), i * 110)); },
    save: () => { tone(90, 0.2, 'sawtooth', 0.2); crowd(0.8, 0.12); },
    miss: () => tone(300, 0.5, 'sawtooth', 0.12, 120),
  };

  // ---------- Input ----------
  function toGame(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  cv.addEventListener('pointermove', e => { if (state === 'aim') aim = toGame(e); });
  cv.addEventListener('pointerdown', e => {
    audio();
    const p = toGame(e);
    if (state === 'title') { level = 0; totalGoals = 0; newMatch(); sfx.whistle(); return; }
    if (state === 'aim') { if (p.y < SPOT.y - 60) shoot(p); return; }
    if (state === 'matchEnd' && timer > 0.8) {
      if (won) {
        level++;
        if (level >= LEVELS.length) { state = 'champion'; timer = 0; burst(200, 300, 150); sfx.goal(); return; }
      }
      newMatch(); sfx.whistle(); return;
    }
    if (state === 'champion' && timer > 1.2) { state = 'title'; }
  });

  // ---------- Gameplay ----------
  function shoot(p){
    const L = LEVELS[level];
    // Aiming close to the edges is risky: a little random wobble on every shot
    const spread = 10 + level * 2;
    const a = Math.random() * Math.PI * 2, d = Math.random() * spread;
    ball.tx = p.x + Math.cos(a) * d;
    ball.ty = p.y + Math.sin(a) * d;
    ball.t = 0; ball.flying = true; ball.bounce = null;
    aim = { x: p.x, y: p.y };

    // Keeper decides: guess the right side with chance = skill, otherwise random
    const reads = Math.random() < L.skill;
    const gx = reads ? ball.tx : GOAL.l + 30 + Math.random() * (GOAL.r - GOAL.l - 60);
    const gy = reads ? ball.ty : GOAL.bot - 45 - Math.random() * 50;
    keeper.tx = Math.max(GOAL.l + 20, Math.min(GOAL.r - 20, gx));
    keeper.ty = Math.max(GOAL.top + 30, Math.min(GOAL.bot - 45, gy));
    keeper.delay = 0.12;
    keeper.dir = Math.sign(keeper.tx - keeper.x);
    state = 'shot';
    sfx.kick();
  }

  function finishShot(){
    const bx = ball.tx, by = ball.ty;
    const L = LEVELS[level];
    const inGoal = bx > GOAL.l + 4 && bx < GOAL.r - 4 && by > GOAL.top + 4 && by < GOAL.bot;
    const hitPost = !inGoal && (
      (Math.abs(bx - GOAL.l) < 8 || Math.abs(bx - GOAL.r) < 8) && by > GOAL.top - 6 && by < GOAL.bot ||
      Math.abs(by - GOAL.top) < 8 && bx > GOAL.l - 6 && bx < GOAL.r + 6);
    const saved = inGoal && Math.abs(bx - keeper.x) < 38 && Math.abs(by - keeper.y) < 50;

    kick++;
    if (saved) {
      results.push('save'); msg = pick(SAVE_LINES) + ' ' + L.keeper + ' stops it'; msgColor = '#ffb4a8';
      ball.bounce = { vx: (bx - 200) * 0.8 + (Math.random() - .5) * 200, vy: 380 };
      sfx.save(); shake = 6;
    } else if (inGoal) {
      results.push('goal'); goals++; totalGoals++; msg = pick(GOAL_LINES); msgColor = '#ffe066';
      netHit = { x: bx, y: by, t: 0 };
      burst(bx, by, 50); sfx.goal(); shake = 10;
    } else {
      results.push('miss'); msg = hitPost ? 'Off the post!' : (by < GOAL.top ? 'Over the bar!' : 'Just wide!'); msgColor = '#cfd8e3';
      if (hitPost) ball.bounce = { vx: (200 - bx) * 1.5, vy: 300 };
      sfx.miss();
    }
    state = 'result'; timer = 0;
  }

  function endMatch(){
    won = goals >= 3;
    const lost = goals + (KICKS - kick) < 3;
    if (!won && !lost) return false;
    state = 'matchEnd'; timer = 0; fact = pick(FACTS);
    if (totalGoals > best) { best = totalGoals; try { localStorage.setItem('messiBest', best); } catch(e) {} }
    if (won) { burst(200, 250, 100); sfx.whistle(); }
    return true;
  }

  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function burst(x, y, n){
    const cols = ['#75aadb', '#ffffff', '#ffe066', '#ff6b6b', '#6bff95'];
    for (let i = 0; i < n; i++) particles.push({
      x, y, vx: (Math.random() - .5) * 420, vy: -Math.random() * 380 - 60,
      life: 1.4 + Math.random(), c: pick(cols), s: 3 + Math.random() * 4, rot: Math.random() * 6
    });
  }

  function update(dt){
    timer += dt;
    shake = Math.max(0, shake - dt * 30);

    if (state === 'shot') {
      if (keeper.delay > 0) keeper.delay -= dt;
      else moveKeeper(dt);
      ball.t += dt / 0.55;
      if (ball.t >= 1) { ball.t = 1; finishShot(); }
      const t = ball.t;
      ball.x = ball.sx + (ball.tx - ball.sx) * t;
      ball.y = ball.sy + (ball.ty - ball.sy) * t - Math.sin(Math.PI * t) * 40;
      ball.r = 13 - 6 * t;
    } else if (state === 'result') {
      moveKeeper(dt);
      if (ball.bounce) {
        ball.x += ball.bounce.vx * dt; ball.y += ball.bounce.vy * dt;
        ball.bounce.vy += 300 * dt; ball.r = Math.min(13, ball.r + dt * 8);
      }
      if (timer > 1.6) {
        if (!endMatch()) { resetBall(); resetKeeper(); state = 'aim'; msg = ''; }
      }
    }
    if (netHit) { netHit.t += dt; if (netHit.t > 0.8) netHit = null; }
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; p.rot += dt * 8; });
    particles = particles.filter(p => p.life > 0);
    if (state === 'champion' && Math.random() < 0.15) burst(Math.random() * W, 150 + Math.random() * 200, 12);
  }

  function moveKeeper(dt){
    const sp = LEVELS[level].speed * dt;
    const dx = keeper.tx - keeper.x, dy = keeper.ty - keeper.y, d = Math.hypot(dx, dy);
    if (d > sp) { keeper.x += dx / d * sp; keeper.y += dy / d * sp; }
    else { keeper.x = keeper.tx; keeper.y = keeper.ty; }
  }

  // ---------- Drawing ----------
  function draw(){
    ctx.save();
    if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawStadium();
    drawGoal();
    drawKeeper();
    if (state !== 'title' && state !== 'champion') drawMessi();
    if (state === 'aim' || state === 'shot' || state === 'result') drawBall();
    ctx.restore();

    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); ctx.restore();
    });

    if (state === 'aim' && aim && aim.y < SPOT.y - 60) drawCrosshair(aim.x, aim.y);
    if (state !== 'title' && state !== 'champion') drawHud();
    if (state === 'aim' && kick === 0) banner('Tap the goal to shoot!', 440, 20, '#fff');
    if (state === 'result' || state === 'shot') if (msg) banner(msg, 330, msg.length > 16 ? 22 : 38, msgColor, true);
    if (state === 'title') drawTitle();
    if (state === 'matchEnd') drawMatchEnd();
    if (state === 'champion') drawChampion();
  }

  function drawStadium(){
    // sky + stands
    const g = ctx.createLinearGradient(0, 0, 0, 200);
    g.addColorStop(0, '#0b1d3a'); g.addColorStop(1, '#1d3b6b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 200);
    // crowd dots
    for (let row = 0; row < 7; row++) {
      for (let i = 0; i < 34; i++) {
        const x = i * 12 + (row % 2) * 6, y = 40 + row * 14;
        const seed = (row * 34 + i) * 9301 % 233;
        const jump = (state === 'result' && results[results.length - 1] === 'goal') || state === 'champion'
          ? Math.abs(Math.sin(performance.now() / 120 + seed)) * 4 : 0;
        ctx.fillStyle = seed % 3 === 0 ? '#75aadb' : seed % 3 === 1 ? '#ffffff' : '#2a4a7a';
        ctx.beginPath(); ctx.arc(x, y - jump, 4, 0, 7); ctx.fill();
      }
    }
    // floodlights
    ctx.fillStyle = 'rgba(255,255,220,.9)';
    [[20, 20], [380, 20]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); });
    // ad boards
    ctx.fillStyle = '#75aadb'; ctx.fillRect(0, 140, W, 22);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('★ VAMOS LEO ★   GOAT 10   ★ VAMOS LEO ★', 200, 156);
    // pitch stripes
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 ? '#2f9e44' : '#37b24d';
      const y0 = 162 + i * 48;
      ctx.fillRect(0, y0, W, 48);
    }
    // lines
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GOAL.bot); ctx.lineTo(W, GOAL.bot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, GOAL.bot); ctx.lineTo(0, 470); ctx.moveTo(380, GOAL.bot); ctx.lineTo(400, 470); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, GOAL.bot); ctx.lineTo(80, 340); ctx.lineTo(320, 340); ctx.lineTo(300, GOAL.bot); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(SPOT.x, SPOT.y + 8, 6, 3, 0, 0, 7); ctx.fill();
  }

  function drawGoal(){
    // net
    ctx.save();
    ctx.beginPath(); ctx.rect(GOAL.l, GOAL.top, GOAL.r - GOAL.l, GOAL.bot - GOAL.top); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(GOAL.l, GOAL.top, GOAL.r - GOAL.l, GOAL.bot - GOAL.top);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    for (let x = GOAL.l; x <= GOAL.r; x += 12) for (let y = GOAL.top; y <= GOAL.bot; y += 12) {
      let ox = 0, oy = 0;
      if (netHit) {
        const d = Math.hypot(x - netHit.x, y - netHit.y), k = Math.max(0, 1 - d / 70) * Math.sin(netHit.t * 20) * (1 - netHit.t) * 6;
        ox = k; oy = k;
      }
      ctx.strokeRect(x + ox, y + oy, 12, 12);
    }
    ctx.restore();
    // posts
    ctx.fillStyle = '#fff';
    ctx.fillRect(GOAL.l - 6, GOAL.top - 6, 6, GOAL.bot - GOAL.top + 6);
    ctx.fillRect(GOAL.r, GOAL.top - 6, 6, GOAL.bot - GOAL.top + 6);
    ctx.fillRect(GOAL.l - 6, GOAL.top - 6, GOAL.r - GOAL.l + 12, 6);
  }

  function drawKeeper(){
    const k = keeper, tilt = (k.x - 200) / 140 * 0.9;
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(tilt);
    // shadow-ish legs
    ctx.fillStyle = '#222'; ctx.fillRect(-12, 18, 9, 26); ctx.fillRect(3, 18, 9, 26);
    // body
    ctx.fillStyle = '#e8590c'; roundRect(-17, -22, 34, 42, 8); ctx.fill();
    // arms
    ctx.strokeStyle = '#e8590c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    const up = state === 'shot' || state === 'result';
    ctx.beginPath();
    ctx.moveTo(-15, -15); ctx.lineTo(up ? -30 : -30, up ? -40 : 5);
    ctx.moveTo(15, -15); ctx.lineTo(up ? 30 : 30, up ? -40 : 5); ctx.stroke();
    // gloves
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(-30, up ? -42 : 7, 7, 0, 7); ctx.arc(30, up ? -42 : 7, 7, 0, 7); ctx.fill();
    // head
    ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, -33, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#3b2a1a'; ctx.beginPath(); ctx.arc(0, -37, 11, Math.PI, 0); ctx.fill();
    ctx.restore();
  }

  function drawMessi(){
    // Messi seen from behind, stepping up to the ball
    let run = 0;
    if (state === 'shot') run = Math.min(1, ball.t * 4);
    const x = SPOT.x + 34 - run * 18, y = SPOT.y + 10 - run * 10;
    ctx.save(); ctx.translate(x, y);
    // legs
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-12, 30, 10, 24); ctx.fillRect(4, 30, 10, 24);
    ctx.fillStyle = '#f1c27d'; ctx.fillRect(-12, 38, 10, 10); ctx.fillRect(4, 38, 10, 10);
    ctx.fillStyle = '#fff'; ctx.fillRect(-12, 40, 10, 12); ctx.fillRect(4, 40, 10, 12);
    ctx.fillStyle = '#222'; ctx.fillRect(-13, 52, 12, 6); ctx.fillRect(3, 52, 12, 6);
    // shorts
    ctx.fillStyle = '#1a1a1a'; roundRect(-15, 18, 32, 16, 4); ctx.fill();
    // shirt with Argentina stripes
    ctx.save(); roundRect(-18, -24, 38, 46, 8); ctx.clip();
    for (let i = -18; i < 22; i += 8) { ctx.fillStyle = ((i + 18) / 8) % 2 ? '#fff' : '#75aadb'; ctx.fillRect(i, -24, 8, 46); }
    ctx.restore();
    // arms
    ctx.fillStyle = '#f1c27d'; ctx.fillRect(-25, -16, 8, 28); ctx.fillRect(19, -16, 8, 28);
    // name + number
    ctx.fillStyle = '#0b1d3a'; ctx.textAlign = 'center';
    ctx.font = 'bold 8px system-ui'; ctx.fillText('MESSI', 1, -12);
    ctx.font = 'bold 20px system-ui'; ctx.fillText('10', 1, 10);
    // head (back of head, beard edge)
    ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(1, -34, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(1, -36, 11.5, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
    ctx.restore();
  }

  function drawBall(){
    const b = ball;
    // shadow
    if (state !== 'aim') {
      const t = Math.min(1, b.t), sy = b.sy + (b.ty - b.sy) * t + 6;
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(b.x, Math.max(sy, b.y + 4), b.r, b.r * 0.35, 0, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 12);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(Math.cos(a) * b.r * 0.4, Math.sin(a) * b.r * 0.4); }
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + Math.PI / 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * b.r * 0.95, Math.sin(a) * b.r * 0.95, b.r * 0.28, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawCrosshair(x, y){
    const pulse = 1 + Math.sin(performance.now() / 150) * 0.15;
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 14 * pulse, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x - 8, y); ctx.moveTo(x + 8, y); ctx.lineTo(x + 20, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x, y - 8); ctx.moveTo(x, y + 8); ctx.lineTo(x, y + 20); ctx.stroke();
  }

  function drawHud(){
    ctx.fillStyle = 'rgba(11,29,58,.85)'; ctx.fillRect(0, 0, W, 34);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(LEVELS[level].name, 10, 22);
    ctx.textAlign = 'right'; ctx.fillText("Goals " + goals + "/" + KICKS, W - 10, 22);
    // kick dots
    for (let i = 0; i < KICKS; i++) {
      const r = results[i], x = 150 + i * 20;
      ctx.beginPath(); ctx.arc(x, 17, 7, 0, 7);
      ctx.fillStyle = r === 'goal' ? '#51cf66' : r ? '#ff6b6b' : 'rgba(255,255,255,.25)'; ctx.fill();
    }
  }

  function banner(text, y, size, color, pop){
    const s = pop ? Math.min(1, timer * 6 + 0.3) : 1;
    ctx.save(); ctx.translate(200, y); ctx.scale(s, s);
    ctx.font = '900 ' + size + 'px system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(text, 0, 0);
    ctx.fillStyle = color; ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function panel(){
    ctx.fillStyle = 'rgba(11,29,58,.92)'; roundRect(24, 150, 352, 360, 18); ctx.fill();
    ctx.strokeStyle = '#75aadb'; ctx.lineWidth = 3; ctx.stroke();
  }

  function wrap(text, x, y, maxW, lh){
    const words = text.split(' '); let line = '';
    for (const w of words) {
      if (ctx.measureText(line + w).width > maxW && line) { ctx.fillText(line, x, y); line = ''; y += lh; }
      line += w + ' ';
    }
    ctx.fillText(line, x, y);
  }

  function drawTitle(){
    ctx.fillStyle = 'rgba(11,29,58,.55)'; ctx.fillRect(0, 0, W, H);
    panel();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#75aadb'; ctx.font = '900 40px system-ui'; ctx.fillText('MESSI', 200, 215);
    ctx.fillStyle = '#fff'; ctx.font = '900 30px system-ui'; ctx.fillText('PENALTY HERO', 200, 250);
    ctx.font = '48px system-ui'; ctx.fillText('⚽🐐🏆', 200, 315);
    ctx.font = '16px system-ui'; ctx.fillStyle = '#dbe7f5';
    wrap('Take 5 penalties as Leo Messi. Score 3 to beat the keeper and move up. Win all 5 levels to lift the World Cup!', 200, 360, 300, 22);
    ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#ffe066';
    ctx.fillText('Best total goals: ' + best, 200, 452);
    const p = 1 + Math.sin(performance.now() / 250) * 0.05;
    ctx.save(); ctx.translate(200, 488); ctx.scale(p, p);
    ctx.font = '900 20px system-ui'; ctx.fillStyle = '#51cf66'; ctx.fillText('TAP TO PLAY', 0, 0); ctx.restore();
  }

  function drawMatchEnd(){
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    panel(); ctx.textAlign = 'center';
    const last = level === LEVELS.length - 1;
    ctx.font = '900 30px system-ui';
    ctx.fillStyle = won ? '#ffe066' : '#ffb4a8';
    ctx.fillText(won ? (last ? 'CHAMPIONS!' : 'YOU WIN!') : 'SO CLOSE!', 200, 200);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui';
    ctx.fillText(goals + ' goals vs ' + LEVELS[level].keeper, 200, 234);
    ctx.font = '44px system-ui'; ctx.fillText(won ? '🏆' : '💪', 200, 292);
    ctx.fillStyle = '#75aadb'; ctx.font = 'bold 14px system-ui'; ctx.fillText('MESSI FACT', 200, 340);
    ctx.fillStyle = '#dbe7f5'; ctx.font = '16px system-ui'; wrap(fact, 200, 366, 300, 22);
    ctx.fillStyle = '#51cf66'; ctx.font = '900 18px system-ui';
    const next = won ? (last ? 'Tap to lift the World Cup!' : 'Tap for next level: ' + LEVELS[level + 1].name) : 'Tap to try again';
    wrap(next, 200, 470, 320, 22);
  }

  function drawChampion(){
    ctx.fillStyle = 'rgba(11,29,58,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '110px system-ui'; ctx.fillText('🏆', 200, 330);
    banner('WORLD CHAMPION!', 400, 34, '#ffe066');
    banner('Just like Leo in 2022!', 440, 20, '#fff');
    banner(totalGoals + ' goals scored', 480, 18, '#75aadb');
    if (timer > 1.2) banner('Tap to play again', 560, 18, '#51cf66');
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
